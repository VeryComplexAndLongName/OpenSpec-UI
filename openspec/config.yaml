schema: spec-driven

context: |
  Dashboard for OpenSpec with CLI-agent execution, delivered in two forms
  (standalone web tool and VS Code extension) on shared code. TypeScript
  monorepo, npm workspaces: packages/core (execution engine, OpenSpec parser,
  git, security model — the single source of truth for behavior),
  packages/server (thin REST/WS layer over core, used only for standalone),
  packages/webui (shared React components, transport-agnostic — Transport
  interface with FetchTransport/MessageBridgeTransport), packages/extension
  (VS Code extension — maximum use of native API instead of custom UI:
  TreeDataProvider, diff editor, built-in Git API, Tasks API,
  contributes.configuration, optionally Chat Participant API).
  The full architectural rationale is in
  docs/adr/0001-shared-core-two-delivery-targets.md, including the rejected
  alternatives. Do not reopen the "extension: direct import + message bridge
  as the primary mode, local server optional" decision without a strong new
  reason — this is the revised decision after external review, not the first
  draft.
  Key invariants that must not be violated without a new ADR: (1) all business
  logic lives only in core; server/extension are thin adapters for their own
  transport; (2) the unified command protocol (plan/implement/review/status/
  cancel) and event protocol (started/stdout/stderr/progress/completed/failed/
  cancelled) are defined only in core; (3) the CLI-agent orchestration
  security model (command allowlist, cwd sandbox, audit, repository file
  contents as data, not executable instructions for the UI) is a required part
  of the first change, not an optional follow-up.
  Testing uses Vitest. Contract tests between webui and server are required
  before archiving any change that touches their protocol.
  Every agent working in this repository must run only targeted local
  verification of changed behavior and directly affected callers/contracts.
  Select test files or test names, lint paths, affected TypeScript projects,
  and relevant smoke checks explicitly. Full verification and unfiltered
  test/browser/integration suites, even within one package, run only in CI.
  Do not run npm run verify or other unscoped root verification locally,
  or reproduce a full run in batches, worktrees, or separate agent runs.
  Keep the existing CI gates; report scoped local results separately from
  full CI results, and never treat an unexecuted full suite as passed.
  Release notes describe the product a person uses, even when its code
  changes only in Core or Shared UI. Every new proposal has a Changelog
  section naming affected public deliveries with one to three concrete
  bullets. Each bullet uses one or two sentences stating observable
  behavior and essential requirements or limits; keep each changeset
  body within 80 words. Name the affected delivery packages in Changesets
  so their users receive authored notes, not only Updated dependencies.

rules:
  proposal:
    - >-
      Add a Changelog section with affected public deliveries and one to
      three concise, concrete bullets suitable for their release notes.
      State what users can do or what now behaves differently, where it
      applies, and only essential requirements or limits. Avoid vague
      fixes, implementation diaries, unsupported claims and dependency-only
      placeholders. If no public behavior changes, explain that scope.
    - The "Why" section must reference a specific architecture decision from
      docs/adr/ or a specific risk raised in review — not an abstract "we need
      this feature".
    - The "Capabilities" section must always explicitly list both New and
      Modified, even when one of them is empty.
  design:
    - A "Non-Goals" section is required.
    - The "Decisions" section must list rejected alternatives and the reason
      for rejecting them, not just the chosen solution.
    - A "Risks / Trade-offs" section is always required.
    - If the change touches the command/event protocol (see the context
      above), explicitly list which commands/events are added or changed, and
      confirm backward compatibility with the already implemented adapters
      (server/extension), if they exist at the time of the change.
  tasks:
    - >-
      Include a task to turn the proposal's Changelog copy into Changesets
      entries for each affected public delivery (openspec-ui-vscode,
      @openspec-ui/server, @openspec-ui/cli), even for shared Core/UI work.
      Use the semver level of the actual behavior change, not its code
      location; different product audiences may need separate entries.
      Keep one to three bullets, one or two sentences each, at most 80 words
      per body. Verify that product notes survive manifest/release parsing;
      Updated dependencies alone is not an authored release note.
    - Every task must be verifiable (a specific file/test), not an abstract
      "improve X".
    - >-
      Every agent implementing or verifying a change must run only targeted
      local checks of the changed behavior and directly affected callers or
      contracts. State selected test files or test names, lint paths,
      affected TypeScript projects, and relevant smoke checks in tasks.
      Full verification and unfiltered suites, even within one package,
      run only in CI; do not split a full local run into batches, worktrees,
      or agent assignments. Do not add local npm run verify, unfiltered
      package suites, or unscoped root verification commands.
    - >-
      Do not declare check(test), check(lint), or check(typecheck) on this
      repository's local tasks: the Harness expands them to unscoped root
      npm scripts before the verifying agent runs. Write an explicitly
      scoped local command in task text instead. When an existing task
      conflicts with this policy, update its verification scope before
      running it; do not silently execute the broad command or mark it
      passed without evidence. Keep archived records unchanged.
    - >-
      Record the selected local commands and their actual results. Full
      verification belongs to the existing pull-request CI gates, not to a
      full-suite item in the local tasks.md checklist or a pre-commit
      prerequisite. Report full CI separately as pending until it finishes;
      never mark an unexecuted suite as passed.
    - Tasks in execution-core that implement the security model (allowlist,
      cwd sandbox, audit) cannot be marked complete without the corresponding
      test in tasks — this is not a decorative section.
    - One task must cover one file and one verifiable outcome; split any task
      that names two files or two distinct behaviors.
    - Name exact identifiers (function, command, or symbol names), exact file
      paths, and the exact expected result instead of referring to "the
      relevant" or "the corresponding" code.
    - When a plausible-looking generalization of a task would be wrong, state
      the prohibition explicitly in the task itself.
    - >-
      A task that an implementing agent cannot perform (live, interactive, or
      manual verification) must be marked as such in the task text, and must
      be reported as outstanding rather than checked off. Which marking
      depends on why: `**Human-only**` where no agent can make the check (a
      judgement, whether something reads well), and
      `**Delegated to <agent-id>**` where another agent can — a live run, a
      real VS Code host, a browser, a query against GitHub. The id is a
      registry id (`copilot-cli`, `claude-cli-acp`), the same string
      `stepAgents` accepts, so a misspelling is detectable.
    - A delegated task must state the evidence the named agent has to record —
      a test name and its run, a run id and the audit line, a command and its
      output — and may be checked off only with that evidence written into the
      task text. An agent asked to confirm that something works will confirm
      that it works; an agent asked to quote a line either has it or does not.
    - The implementing agent marks each task `[x]` in tasks.md as soon as that
      task's own verification has passed — incrementally, not in a single batch
      at the end of the run, and never before the task is actually done.
    - When a change threads a new value through multiple layers, the tasks must
      name the complete path it travels (origin through every intermediate layer
      to the point of use) and require verification at each junction — not only
      at the two ends. A task phrased as "widen the type here" is most cheaply
      satisfied by discarding the new value at that layer, which type-checks and
      passes every existing test; explicit junction checks prevent this.
    - When an implementing agent reaches a task it cannot perform (live,
      interactive, or manual verification), it SHALL skip that task, continue
      with the remaining tasks, and report the skipped task as outstanding —
      it never stops to wait for a human inside a run, since nothing in the
      harness is listening for that wait — `apply` runs headless, and a chain
      under `autonomous` has no confirmation channel at all. An author who
      needs a run to actually stop must express that through `autonomyLevel`
      (`assisted`, or `semi-autonomous` with
      `checkpoints.requireConfirmationBetweenSteps`), not through task text.

operations:
  apply:
    guidance:
      - All repository modifications must belong to an active OpenSpec change
        entry in `openspec/changes/<id>/`; do not bypass the change workflow
        with ad-hoc direct commits.
      - Architecture-impacting modifications require an ADR in `docs/adr/`
        linked from the related OpenSpec change before the implementation can
        be considered complete.
      - Use the runtime pinned in the root package.json (`volta` + `engines`)
        for local and CI execution; do not run repository commands with
        arbitrary global Node.js/npm versions.
      - >-
        Before completing apply, run only targeted local verification:
        selected tests for changed behavior and directly affected contracts,
        lint on changed source paths, and affected TypeScript project checks
        where relevant. For server/extension behavior changes, run a relevant
        real smoke scenario before its task is marked complete. Full
        repository verification and unfiltered package, browser, or
        integration suites run only in CI; never run them locally, even in
        separate batches, worktrees, or agent runs. Do not require a full
        local run before committing; preserve the existing CI gates.
      - A version bump in the affected package's package.json is mandatory in
        sync with every externally visible behavior change, proposed via a
        changeset (`npx changeset`) in the same change rather than editing
        `package.json`'s `version` field by hand — see
        `.changeset/README.md` for the full workflow.
      - >-
        Versioning follows semver at the package level: patch — fixes,
        documentation, and refactoring without changing the external
        contract; minor — new capabilities that remain compatible with the
        current contract; major — breaking changes in public behavior,
        protocol, data format, or promised UX.
      - Delivery forms may show an aggregated release version, but the source
        of truth for behavior versions is the package versions; show `core`
        separately if the UI exposes build information.
      - >-
        Before completing apply, write short, specific product-facing
        changeset copy from the proposal's Changelog section. Name affected
        public delivery packages explicitly so shared capabilities are not
        hidden in private Core notes. Preserve accurate introduction
        versions when correcting historical copy; do not retag, replace
        artifacts, or change package versions by hand. Follow
        .changeset/README.md and ADR 0054.
  archive:
    guidance:
      - >-
        Confirm that the Changelog section and changeset describe the
        delivered behavior concisely, name affected public deliveries,
        and disclose essential limits without claiming more than was
        verified. Dependency bookkeeping alone does not satisfy this check.
      - >-
        Use recorded targeted local evidence and the actual full CI results;
        do not rerun complete suites locally to archive a change. A full CI
        result is pending until CI reports it, and required verification
        items stay open until their evidence is available.
      - Before archiving, proposal.md/design.md must explicitly state which
        contract tests between webui and server actually passed (not "should
        pass"), and which risks remain open, with a link to the specific task.
      - Do not archive a change if even one scenario from specs/ was not
        actually verified by a test in code.
      - Do not archive a change that adds or changes a command/event in the
        protocol (see the context) without an updated contract test that covers
        that exact change.
