schema: spec-driven

context: |
  Дашборд для OpenSpec с запуском CLI-агентов, в двух формах поставки
  (standalone web-инструмент, VS Code extension) на общем коде. TypeScript
  монорепозиторий, npm workspaces: packages/core (execution engine,
  openspec-парсер, git, security-модель — единственный источник правды по
  поведению), packages/server (тонкий REST/WS слой над core, только для
  standalone), packages/webui (общие React-компоненты, транспорт-агностичные
  — интерфейс Transport с FetchTransport/MessageBridgeTransport),
  packages/extension (VS Code расширение — максимум нативного API вместо
  своего UI: TreeDataProvider, diff-editor, встроенный Git API, Tasks API,
  contributes.configuration, опционально Chat Participant API).
  Полное архитектурное обоснование — docs/adr/0001-shared-core-two-delivery-
  targets.md, включая отклонённые альтернативы. Не переоткрывайте решение
  "extension: прямой import + message bridge как основной режим, локальный
  сервер — опциональный" без веской новой причины — это скорректированное
  по итогам внешней рецензии решение, не первый черновик.
  Ключевые инварианты, не подлежащие нарушению без нового ADR: (1) вся
  бизнес-логика — только в core, server/extension — тонкие адаптеры под
  свой транспорт; (2) единый протокол команд (plan/implement/review/status/
  cancel) и событий (started/stdout/stderr/progress/completed/failed/
  cancelled), определённый только в core; (3) security-модель оркестрации
  CLI-агентов (allowlist команд, cwd-sandbox, аудит, содержимое файлов
  репозитория — данные, не исполняемые инструкции для самого UI) —
  обязательная часть первого change'а, не опциональная доработка.
  Тестирование — Vitest. Contract tests между webui и server — обязательны
  перед архивацией любого change'а, затрагивающего протокол между ними.

rules:
  proposal:
    - Секция "Why" ссылается на конкретное архитектурное решение из
      docs/adr/ или на конкретный риск, поднятый в рецензии — не на
      абстрактное "нужна эта фича".
    - Секция "Capabilities" всегда явно указывает и New, и Modified, даже
      когда один из разделов пуст.
  design:
    - Обязательна секция "Non-Goals".
    - Секция "Decisions" перечисляет отклонённые альтернативы и причину
      отказа — не только выбранное решение.
    - Секция "Risks / Trade-offs" обязательна всегда.
    - Если change касается протокола команд/событий (см. context выше) —
      явно перечислить, какие команды/события добавлены/изменены, и
      подтвердить обратную совместимость с уже реализованными адаптерами
      (server/extension), если они уже существуют на момент change'а.
  tasks:
    - Каждая задача — проверяемая (конкретный файл/тест), не абстрактное
      "улучшить X".
    - Задачи в execution-core, реализующие security-модель (allowlist,
      cwd-sandbox, аудит), не могут быть отмечены выполненными без
      соответствующего теста в tasks — это не декоративная секция.

operations:
  apply:
    guidance:
      - Перед завершением apply — tsc (typecheck), eslint, vitest проходят
        для затронутых пакетов; для server/extension — дополнительно ручной
        smoke-тест (реальный запуск, не только юнит-тесты) перед тем, как
        отмечать задачу выполненной.
      - Version bump в package.json затронутого пакета обязателен синхронно
        с каждым внешне видимым изменением поведения.
      - >-
        Версионирование — semver на уровне каждого пакета: patch —
        исправления, документация и рефакторинг без изменения внешнего
        контракта; minor — новые возможности, совместимые с текущим
        контрактом; major — breaking changes в публичном поведении,
        протоколе, формате данных или обещанном UX.
      - Для delivery-форм можно показывать агрегированную версию релиза,
        но источник правды по версии поведения — версии пакетов; версию
        `core` показывать отдельно, если UI выводит сведения о сборке.
  archive:
    guidance:
      - Перед архивацией proposal.md/design.md должны явно отражать, какие
        contract tests между webui и server реально прошли (не "должны
        проходить"), и какие риски остаются открытыми со ссылкой на
        конкретную задачу.
      - Не архивировать change, если хотя бы один сценарий из specs/ не был
        реально проверен тестом в коде.
      - Change, добавляющий или меняющий команду/событие в протоколе
        (см. context) — не архивировать без обновлённого contract test,
        покрывающего именно это изменение.
