schema: spec-driven

context: |
  Dashboard for OpenSpec with CLI-agent execution, delivered in two forms
  (standalone web tool and VS Code extension) on shared code. TypeScript
  monorepo, npm workspaces: packages/core (execution engine, OpenSpec parser,
  git, security model — the single source of truth for behavior),
  packages/server (thin REST/WS layer over core, used only for standalone),
  packages/webui (shared React components, transport-agnostic — Transport
  interface with FetchTransport/MessageBridgeTransport), packages/extension
  (VS Code extension — maximum use of native API instead of custom UI:
  TreeDataProvider, diff editor, built-in Git API, Tasks API,
  contributes.configuration, optionally Chat Participant API).
  The full architectural rationale is in
  docs/adr/0001-shared-core-two-delivery-targets.md, including the rejected
  alternatives. Do not reopen the "extension: direct import + message bridge
  as the primary mode, local server optional" decision without a strong new
  reason — this is the revised decision after external review, not the first
  draft.
  Key invariants that must not be violated without a new ADR: (1) all business
  logic lives only in core; server/extension are thin adapters for their own
  transport; (2) the unified command protocol (plan/implement/review/status/
  cancel) and event protocol (started/stdout/stderr/progress/completed/failed/
  cancelled) are defined only in core; (3) the CLI-agent orchestration
  security model (command allowlist, cwd sandbox, audit, repository file
  contents as data, not executable instructions for the UI) is a required part
  of the first change, not an optional follow-up.
  Testing uses Vitest. Contract tests between webui and server are required
  before archiving any change that touches their protocol.

rules:
  proposal:
    - The "Why" section must reference a specific architecture decision from
      docs/adr/ or a specific risk raised in review — not an abstract "we need
      this feature".
    - The "Capabilities" section must always explicitly list both New and
      Modified, even when one of them is empty.
  design:
    - A "Non-Goals" section is required.
    - The "Decisions" section must list rejected alternatives and the reason
      for rejecting them, not just the chosen solution.
    - A "Risks / Trade-offs" section is always required.
    - If the change touches the command/event protocol (see the context
      above), explicitly list which commands/events are added or changed, and
      confirm backward compatibility with the already implemented adapters
      (server/extension), if they exist at the time of the change.
  tasks:
    - Every task must be verifiable (a specific file/test), not an abstract
      "improve X".
    - Tasks in execution-core that implement the security model (allowlist,
      cwd sandbox, audit) cannot be marked complete without the corresponding
      test in tasks — this is not a decorative section.
    - One task must cover one file and one verifiable outcome; split any task
      that names two files or two distinct behaviors.
    - Name exact identifiers (function, command, or symbol names), exact file
      paths, and the exact expected result instead of referring to "the
      relevant" or "the corresponding" code.
    - When a plausible-looking generalization of a task would be wrong, state
      the prohibition explicitly in the task itself.
    - A task that an implementing agent cannot perform (live, interactive, or
      manual verification) must be marked as such in the task text, and must
      be reported as outstanding rather than checked off.
    - The implementing agent marks each task `[x]` in tasks.md as soon as that
      task's own verification has passed — incrementally, not in a single batch
      at the end of the run, and never before the task is actually done.
    - When a change threads a new value through multiple layers, the tasks must
      name the complete path it travels (origin through every intermediate layer
      to the point of use) and require verification at each junction — not only
      at the two ends. A task phrased as "widen the type here" is most cheaply
      satisfied by discarding the new value at that layer, which type-checks and
      passes every existing test; explicit junction checks prevent this.

operations:
  apply:
    guidance:
      - All repository modifications must belong to an active OpenSpec change
        entry in `openspec/changes/<id>/`; do not bypass the change workflow
        with ad-hoc direct commits.
      - Architecture-impacting modifications require an ADR in `docs/adr/`
        linked from the related OpenSpec change before the implementation can
        be considered complete.
      - Use the runtime pinned in the root package.json (`volta` + `engines`)
        for local and CI execution; do not run repository commands with
        arbitrary global Node.js/npm versions.
      - Before completing apply, tsc (typecheck), eslint, and vitest must pass
        for the affected packages; for server/extension, a manual smoke test
        (a real run, not just unit tests) is also required before a task may be
        marked complete.
      - A version bump in the affected package's package.json is mandatory in
        sync with every externally visible behavior change, proposed via a
        changeset (`npx changeset`) in the same change rather than editing
        `package.json`'s `version` field by hand — see
        `.changeset/README.md` for the full workflow.
      - >-
        Versioning follows semver at the package level: patch — fixes,
        documentation, and refactoring without changing the external
        contract; minor — new capabilities that remain compatible with the
        current contract; major — breaking changes in public behavior,
        protocol, data format, or promised UX.
      - Delivery forms may show an aggregated release version, but the source
        of truth for behavior versions is the package versions; show `core`
        separately if the UI exposes build information.
  archive:
    guidance:
      - Before archiving, proposal.md/design.md must explicitly state which
        contract tests between webui and server actually passed (not "should
        pass"), and which risks remain open, with a link to the specific task.
      - Do not archive a change if even one scenario from specs/ was not
        actually verified by a test in code.
      - Do not archive a change that adds or changes a command/event in the
        protocol (see the context) without an updated contract test that covers
        that exact change.
