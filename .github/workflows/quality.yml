name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.11.0
  NPM_VERSION: 10.9.0

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  # Deliberately declares no `needs`, and nothing declares `needs` on it:
  # every other job in this workflow gates on `quality`, so while the
  # audit lived there as its last step, an outage at npm's advisory
  # service skipped the merge gate, the integration suite and the browser
  # suite on pull requests that had nothing to do with dependencies.
  # Observed twice on #210: seven minutes of retries against a 503 from
  # registry.npmjs.org/-/npm/v1/security/audits/quick, then the 10-minute
  # job limit, with `npm run verify` and `npm run build` already green.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Audit production dependencies
        run: |
          # `npm audit` exits non-zero both for "found a high-severity
          # advisory" and for "could not reach the advisory service", and
          # the second must not be reported as the first: an audit that
          # did not run says nothing about these dependencies, in either
          # direction. So the report is read rather than the exit status
          # trusted on its own.
          #
          # `timeout` bounds the command itself, not just the job. A job
          # timeout is a red check, which is the outcome this exists to
          # stop; the command has to give up first so its result can be
          # interpreted at all.
          set +e
          timeout 180 npm audit --omit=dev --audit-level=high --json > audit.json
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::warning::npm audit did not answer within 180s; the audit was not carried out."
            exit 0
          fi
          node .github/scripts/interpret-npm-audit.mjs audit.json
          exit $?

  openspec-validate:
    name: OpenSpec change validation (merge gate)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: npm run start --workspace @openspec-ui/cli -- validate --cwd "$GITHUB_WORKSPACE"

  extension-integration:
    name: Extension integration and package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: xvfb-run -a npm run test:integration --workspace openspec-ui-vscode
      - run: npm run package --workspace openspec-ui-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: openspec-ui-vsix
          path: packages/extension/*.vsix
          if-no-files-found: error

  version-packages:
    name: Version pending changesets
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      # v2 pushes the version branch through the GitHub API rather than
      # the git CLI, so a "Version Packages" commit is GPG-signed by
      # GitHub and attributed to the token's owner rather than to
      # github-actions[bot] via the CLI. That is the only behavioural
      # difference for this workflow -- the renamed inputs are all
      # unused here, and `push-git-tags` applies after a publish step
      # that is not configured (see openspec/changes/changesets-action-v2).
      #
      # `github-token` is the input the action actually reads. It also
      # existed in v1 with this same default, which is why the `env:
      # GH_TOKEN` block that used to sit here was doing nothing in either
      # version and was removed rather than carried forward.
      - name: Create or update version PR
        uses: changesets/action@v2
        with:
          github-token: ${{ github.token }}

  release-extension:
    name: Tag and release VS Code extension
    needs: [quality, extension-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          TAG="openspec-ui-vscode@${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists — nothing to release."
            exit 0
          fi
          npm run package --workspace openspec-ui-vscode
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "openspec-ui-vscode ${VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" packages/extension/*.vsix \
            --title "openspec-ui-vscode ${VERSION}" \
            --generate-notes

  browser-e2e:
    name: Standalone browser and accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: npm exec --workspace @openspec-ui/server playwright -- install --with-deps chromium
      - run: npm run test:browser --workspace @openspec-ui/server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: standalone-playwright-diagnostics
          path: |
            packages/server/playwright-report/
            packages/server/test-results/
          if-no-files-found: warn

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
