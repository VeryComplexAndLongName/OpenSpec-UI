name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.11.0
  NPM_VERSION: 10.9.0

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  # Deliberately declares no `needs`, and nothing declares `needs` on it:
  # every other job in this workflow gates on `quality`, so while the
  # audit lived there as its last step, an outage at npm's advisory
  # service skipped the merge gate, the integration suite and the browser
  # suite on pull requests that had nothing to do with dependencies.
  # Observed twice on #210: seven minutes of retries against a 503 from
  # registry.npmjs.org/-/npm/v1/security/audits/quick, then the 10-minute
  # job limit, with `npm run verify` and `npm run build` already green.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Audit production dependencies
        run: |
          # `npm audit` exits non-zero both for "found a high-severity
          # advisory" and for "could not reach the advisory service", and
          # the second must not be reported as the first: an audit that
          # did not run says nothing about these dependencies, in either
          # direction. So the report is read rather than the exit status
          # trusted on its own.
          #
          # `timeout` bounds the command itself, not just the job. A job
          # timeout is a red check, which is the outcome this exists to
          # stop; the command has to give up first so its result can be
          # interpreted at all.
          set +e
          timeout 180 npm audit --omit=dev --audit-level=high --json > audit.json
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::warning::npm audit did not answer within 180s; the audit was not carried out."
            exit 0
          fi
          node .github/scripts/interpret-npm-audit.mjs audit.json
          exit $?

  openspec-validate:
    name: OpenSpec change validation (merge gate)
    needs: quality
    runs-on: ubuntu-latest
    # 10, not 5, because `npm ci` dominates this job and its cost varies
    # by more than the old budget's margin. Measured on a run that
    # completed in 4m04s: `npm ci` 223.6 s, the validation itself 3.9 s,
    # everything else ~18 s (the two global installs together cost 5.2 s
    # -- they were blamed first, and the measurement refuted it). The
    # same job on the same commit has been observed at 2m22s and at
    # 5m15s. `quality` begins with the same `npm ci` and then does
    # strictly more, and has always had 10 minutes; the gate that does
    # less should not have had half.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: npm run start --workspace @openspec-ui/cli -- validate --cwd "$GITHUB_WORKSPACE"

  extension-integration:
    name: Extension integration and package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: xvfb-run -a npm run test:integration --workspace openspec-ui-vscode
      - run: npm run package --workspace openspec-ui-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: openspec-ui-vsix
          path: packages/extension/*.vsix
          if-no-files-found: error

  version-packages:
    name: Version pending changesets
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      # v2 pushes the version branch through the GitHub API rather than
      # the git CLI, so a "Version Packages" commit is GPG-signed by
      # GitHub and attributed to the token's owner rather than to
      # github-actions[bot] via the CLI. That is the only behavioural
      # difference for this workflow -- the renamed inputs are all
      # unused here, and `push-git-tags` applies after a publish step
      # that is not configured (see openspec/changes/changesets-action-v2).
      #
      # `github-token` is the input the action actually reads. It also
      # existed in v1 with this same default, which is why the `env:
      # GH_TOKEN` block that used to sit here was doing nothing in either
      # version and was removed rather than carried forward.
      - name: Create or update version PR
        uses: changesets/action@v2
        with:
          github-token: ${{ github.token }}

  release-extension:
    name: Tag and release VS Code extension
    needs: [quality, extension-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          TAG="openspec-ui-vscode@${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists — nothing to release."
            exit 0
          fi
          npm run package --workspace openspec-ui-vscode
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "openspec-ui-vscode ${VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" packages/extension/*.vsix \
            --title "openspec-ui-vscode ${VERSION}" \
            --generate-notes

  # Publishes the document OpenSpec-Ui-Homepage reads instead of walking
  # this repository's layout through the GitHub API (see
  # openspec/changes/release-manifest). It gates nothing and nothing gates
  # on it beyond needing the release to exist: a failure here must not
  # skip the merge gate or the suite, the shape ci-audit-own-job
  # established after an npm outage took the whole pipeline down.
  release-manifest:
    name: Publish release manifest
    needs: [quality, release-extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - name: Collect the extension's published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read from the release that release-extension just created,
          # rather than building a URL from the tag by hand: a change in
          # how the release is made must not leave the manifest pointing
          # at something that does not resolve. No release yet (the very
          # first run, or a version already tagged) is not an error — the
          # product is then published with no artifact, which is true.
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          export TAG="openspec-ui-vscode@${VERSION}"
          echo "[]" > releases-input.json
          if gh release view "$TAG" --json url,assets > release.json 2>/dev/null; then
            node -e '
              const fs = require("fs");
              const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
              const artifacts = (release.assets ?? [])
                .filter((asset) => asset.name.endsWith(".vsix"))
                .map((asset) => ({ kind: "vsix", url: asset.url, size_bytes: asset.size }));
              fs.writeFileSync("releases-input.json", JSON.stringify([
                { productId: "vscode-extension", tag: process.env.TAG, url: release.url, artifacts },
              ]));
            '
          else
            echo "::notice::no release for ${TAG}; the extension is published without an artifact"
          fi
      # File arguments are absolute: `npm run start --workspace` runs the
      # CLI with its own package as the working directory, so a relative
      # path here resolves inside packages/cli rather than beside the
      # files the previous step wrote. The shell redirections below are
      # the step's own and stay relative to the repository root.
      - name: Build the manifest
        run: |
          MANIFEST_ARGS="--cwd $GITHUB_WORKSPACE --repository $GITHUB_REPOSITORY"
          npm run start --workspace @openspec-ui/cli -- release-manifest $MANIFEST_ARGS --commit "$GITHUB_SHA" --releases "$GITHUB_WORKSPACE/releases-input.json" > releases.json
          npm run start --workspace @openspec-ui/cli -- release-manifest $MANIFEST_ARGS --fingerprint > fingerprint.new
      - name: Publish only when a version actually changed
        run: |
          # generated_at and commit move on every push. Comparing the
          # id@version set instead means a push that released nothing
          # publishes nothing, and `commit` keeps meaning "the commit
          # these versions were released from".
          git fetch origin release-manifest --depth 1 2>/dev/null || true
          if git show origin/release-manifest:releases.json > published.json 2>/dev/null; then
            npm run start --workspace @openspec-ui/cli -- release-manifest --from "$GITHUB_WORKSPACE/published.json" --fingerprint > fingerprint.old
          else
            echo "(no published manifest)" > fingerprint.old
          fi
          if diff -q fingerprint.old fingerprint.new > /dev/null; then
            echo "::notice::no version changed; the manifest is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          WORK=$(mktemp -d)
          cp releases.json "$WORK/releases.json"
          cd "$WORK"
          git init -q .
          git checkout -q -b release-manifest
          git add releases.json
          git commit -q -m "Release manifest for ${GITHUB_SHA}"
          # Force-updated: only the current state is ever read, so history
          # on this branch serves nobody.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-manifest
        env:
          GH_TOKEN: ${{ github.token }}

  browser-e2e:
    name: Standalone browser and accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: npm ci
      - run: npm exec --workspace @openspec-ui/server playwright -- install --with-deps chromium
      - run: npm run test:browser --workspace @openspec-ui/server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: standalone-playwright-diagnostics
          path: |
            packages/server/playwright-report/
            packages/server/test-results/
          if-no-files-found: warn

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
