name: Publish

# Homepage owns approval, leases, retry budgets and remote confirmations.
# These jobs publish released bytes only; they never build product packages.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify Homepage OIDC identity without claiming or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  NODE_VERSION: 24.21.0
  NPM_PUBLISH_VERSION: 11.5.1
  VSCE_PUBLISH_VERSION: 4.0.2
  PUBLICATION_ORIGIN: https://openspec-ui.dev
  PUBLICATION_PROBE: ${{ inputs.check_only || false }}

jobs:
  npm:
    name: Publish approved npm artifact
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@${NPM_PUBLISH_VERSION}
      - run: node scripts/publication-worker.mjs npm

  marketplace:
    name: Publish approved VSIX artifact
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global @vscode/vsce@${VSCE_PUBLISH_VERSION}
      - run: node scripts/publication-worker.mjs marketplace
