version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # Major-version bumps repeatedly broke this repo's pinned toolchain
      # without warning: typescript 6->7 and eslint 9->10 (both broke
      # typescript-eslint@8.67.0, which requires TypeScript <6.1.0 --
      # see the archived restore-typescript-eslint-compatibility change),
      # @eslint/js 9->10 (peer-requires eslint@^10, ERESOLVE conflict with
      # the pinned eslint -- PR #62), vitest 2->4 (needs native bindings
      # that fail to resolve here plus a newer Node.js than the pinned
      # 22.11.0 -- PR #65), and @types/vscode 1.90->1.134 (vsce package
      # refuses to build once it exceeds packages/extension's declared
      # engines.vscode -- PR #67). Rather than reactively ignoring one
      # broken package name at a time, block every major bump in this
      # group up front: minor/patch updates (including security fixes)
      # keep flowing automatically, and majors wait for a deliberate,
      # reviewed bump instead of an unreviewed grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @types/vscode's own version tracks VS Code's version, not this
      # package's API surface, so a compatibility-breaking jump (like
      # 1.90 -> 1.134) is a semver-MINOR bump ("1" never changes) and the
      # blanket major-only rule above does not catch it. Its version must
      # stay <= packages/extension's declared engines.vscode (currently
      # ^1.90.0), or `vsce package` refuses to build ("@types/vscode
      # ^1.134.0 greater than engines.vscode ^1.90.0"). Bumping this
      # requires deliberately raising engines.vscode too -- not something
      # to accept automatically (seen live in PR #67 and again in PR #71
      # after the blanket rule alone let it through).
      - dependency-name: "@types/vscode"
        versions: [">=1.91.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Same blanket major block as the npm ecosystem above, for a reason
      # specific to actions: a release-path action cannot be exercised by
      # the pull request that changes it. `version-packages` and
      # `release-extension` in quality.yml both carry
      # `if: github.event_name == 'push' && github.ref == 'refs/heads/main'`,
      # so on a pull request they are skipped -- a fully green pull
      # request says nothing about the job the bump actually alters, and
      # a failure would first appear on main as release pull requests
      # quietly no longer being created. Seen with changesets/action 1->2
      # (PR #207). Minor and patch bumps, security fixes included, keep
      # flowing automatically; majors wait for a deliberate change.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
