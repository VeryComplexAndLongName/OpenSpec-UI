version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # Major-version bumps repeatedly broke this repo's pinned toolchain
      # without warning: typescript 6->7 and eslint 9->10 (both broke
      # typescript-eslint@8.67.0, which requires TypeScript <6.1.0 --
      # see the archived restore-typescript-eslint-compatibility change),
      # @eslint/js 9->10 (peer-requires eslint@^10, ERESOLVE conflict with
      # the pinned eslint -- PR #62), vitest 2->4 (needs native bindings
      # that fail to resolve here plus a newer Node.js than the pinned
      # 22.11.0 -- PR #65), and @types/vscode 1.90->1.134 (vsce package
      # refuses to build once it exceeds packages/extension's declared
      # engines.vscode -- PR #67). Rather than reactively ignoring one
      # broken package name at a time, block every major bump in this
      # group up front: minor/patch updates (including security fixes)
      # keep flowing automatically, and majors wait for a deliberate,
      # reviewed bump instead of an unreviewed grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
