version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # typescript-eslint@8.67.0 requires TypeScript <6.1.0; a 7.x bump
      # broke it before (see the archived
      # restore-typescript-eslint-compatibility change).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # ESLint 10 needs a newer Node.js than this repo's pinned 22.11.0
      # runtime.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # @eslint/js is a separate npm package from `eslint` itself; its 10.x
      # line peer-requires eslint@^10, which conflicts with the `eslint`
      # ignore rule above and breaks `npm ci` (ERESOLVE) if bumped alone
      # (seen live in PR #62, "Bump the npm-development group with 4
      # updates").
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      # vitest 4's toolchain (vite 8 / rolldown) needs native bindings that
      # fail to resolve here ("Cannot find module
      # '@rolldown/binding-wasm32-wasi'") and a newer Node.js than this
      # repo's pinned 22.11.0 (seen live in PR #65, "Bump the
      # npm-development group with 3 updates").
      - dependency-name: "vitest"
        versions: [">=3.0.0"]
      # @types/vscode's version must stay <= packages/extension's declared
      # engines.vscode (currently ^1.90.0), or `vsce package` refuses to
      # build ("@types/vscode ^1.134.0 greater than engines.vscode
      # ^1.90.0"). Bumping this requires deliberately raising engines.vscode
      # too -- not something to accept automatically (seen live in PR #67,
      # "Bump the npm-development group across 1 directory with 2 updates").
      - dependency-name: "@types/vscode"
        versions: [">=1.91.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
